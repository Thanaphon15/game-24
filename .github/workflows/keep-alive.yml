name: Keep Supabase Alive

on:
  schedule:
    # Every Monday and Thursday at 03:00 UTC — well under Supabase free
    # tier's 7-day inactivity auto-pause window.
    - cron: '0 3 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://mmgsonaibdpzxqvymewf.supabase.co/rest/v1/app_settings?select=current_season" \
            -H "apikey: sb_publishable_zqZTwin6TSkriACDXKx0qQ_tWA4AZHY" \
            -H "Authorization: Bearer sb_publishable_zqZTwin6TSkriACDXKx0qQ_tWA4AZHY"

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ประวัติของฉัน — GAME24 ONLINE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/favicon-32.png?v=3">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/fantasy.css?v=1">
</head>
<body>
  <div id="auth-gate-overlay" class="auth-gate-overlay">
    <div class="auth-gate-spinner"></div>
  </div>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="./" class="brand"><img src="assets/logo-64.png?v=3" alt="TANTRARAK SCHOOL" class="brand-logo"><span class="brand-textstack"><span class="brand-title">GAME<span>24</span></span><span class="brand-subtitle">TANTRARAK SCHOOL</span></span></a>
      <button class="nav-toggle" aria-label="เมนู"><span></span><span></span><span></span></button>
      <ul class="nav-menu">
        <li><a href="./">หน้าหลัก</a></li>
        <li><a href="guide">วิธีเล่น</a></li>
        <li><a href="practice">PRACTICE</a></li>
        <li><a href="challenge">CHALLENGE</a></li>
        <li><a href="ranking">LEADERBOARD</a></li>
        <li><a href="login">LOGIN</a></li>
        <li><a href="register" class="nav-cta">REGISTER</a></li>
      </ul>
    </div>
  </nav>

  <main class="guide-wrap container">
    <h1 class="shimmer-text" style="text-align:center; margin: 20px 0 4px;">📜 ประวัติของฉัน</h1>
    <p class="section-sub">สถิติและเหรียญตราสะสมตลอดการเล่น (ทุกซีซัน)</p>

    <section class="panel guide-section">
      <h2 class="shimmer-text">สรุปสถิติ</h2>
      <div class="complete-stats" id="history-summary"></div>
    </section>

    <section class="panel guide-section">
      <h2 class="shimmer-text">🏅 เหรียญตราที่ปลดล็อก</h2>
      <div class="badges-row" id="badges-list"></div>
    </section>

    <section class="panel guide-section">
      <h2 class="shimmer-text">🕑 เกมล่าสุด</h2>
      <div class="history-list" id="history-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    GAME24 ONLINE · TANTRARAK SCHOOL — เกมคณิตศาสตร์สำหรับนักเรียนมัธยมศึกษา
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/history.js"></script>
  <script>
    (async () => {
      const overlay = document.getElementById('auth-gate-overlay');
      const user = SUPABASE_CONFIGURED ? await Auth24.getCurrentUser() : null;

      if (!SUPABASE_CONFIGURED || !user) {
        location.href = './';
        return;
      }

      overlay.remove();
      UI24.initNav();
      Auth24.renderNavAuthState();

      const rows = await History24.fetchHistory(user.id, 50);
      History24.renderSummary(document.getElementById('history-summary'), rows);
      History24.renderBadges(document.getElementById('badges-list'), History24.computeBadges(rows));
      History24.renderHistory(document.getElementById('history-list'), rows);
    })();
  </script>
</body>
</html>
